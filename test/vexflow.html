<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Notation Renderer</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body>
  <div id="music-container"></div>
  <script>
    const VF = Vex.Flow;

    function renderMusic(notation) {
      const div = document.getElementById("music-container");
      const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);

      renderer.resize(500, 200);
      const context = renderer.getContext();
      context.setFont("Arial", 10, "").setBackgroundFillStyle("#eed");

      const stave = new VF.Stave(10, 40, 400);
      stave.addClef("treble").addTimeSignature("4/4");
      stave.setContext(context).draw();

      const notes = notation.map(n => new VF.StaveNote({
        keys: [n.key],
        duration: n.duration,
      }));

      const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
      voice.addTickables(notes);

      const formatter = new VF.Formatter().joinVoices([voice]).format([voice], 400);
      voice.draw(context, stave);
    }

    // You can pass the notation from the Python backend
    const notation = [
      { key: "c/4", duration: "q" },
      { key: "d/4", duration: "q" },
      { key: "e/4", duration: "q" },
      { key: "f/4", duration: "q" }
    ];
    renderMusic(notation);
  </script>
</body>
</html>
